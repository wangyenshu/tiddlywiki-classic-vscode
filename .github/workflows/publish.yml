# Builds the extension and attaches the .vsix to a GitHub release when a
# version tag such as v0.1.1 is pushed (or a release is created with a new tag).
# Running it from the Actions tab only builds and tests; the .vsix is kept as
# a workflow artifact.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check version
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error file=package.json::Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Package
        run: |
          mkdir -p dist
          npm run package -- --out "dist/tiddlywiki-classic-${{ steps.check.outputs.version }}.vsix"

      - name: Keep the .vsix as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSIX: dist/tiddlywiki-classic-${{ needs.build.outputs.version }}.vsix
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Attach the .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
